# VitaBrightEX pseudo-v1.4 configuration
# Search precedence: ur0:tai/vitabrightex.cfg, then ux0:tai/.
# A successfully parsed document becomes accepted requested state/provenance.
# Missing keys return to these defaults on every accepted reload.

# OLED (PCH-1000)
oled_panel_lut_override = 0
# panel_lut_path = ur0:tai/my_custom_lut.txt
oled_dim_workaround = 1

# P4/P5 OLED gamma-reference register-code RGB bias. Each value is a saturating
# byte-code offset applied to the matching R/G/B byte of all seven documented
# reference triplets in every 21-byte LUT row. This is NOT linear RGB gain,
# calibrated white balance, or Kelvin CCT. Base LUT remains authoritative;
# hardware receives a derived runtime LUT and persistence writes base only.
color_r_bias = 0
color_g_bias = 0
color_b_bias = 0

# Manual low-brightness OLED warm register profile (P4/P5 only).
# first_row=N applies these additional offsets to every row N..16 inclusive,
# all seven RGB reference triplets per row, after the global bias above.
# This is a manual register-domain profile, not a calibrated color temperature.
oled_warm_enabled = 0
oled_warm_first_row = 6
oled_warm_r_offset = 0
oled_warm_g_offset = 0
oled_warm_b_offset = 0

# Legacy v1.3 keys remain parser-compatible only. Enabling night_mode_enabled
# does NOT select an invented preset and reports an unsupported compatibility
# request. Use the explicit oled_warm_* keys for the supported manual profile.
night_mode_enabled = 0
night_mode_threshold = 6

# Panel colour-space (PCH-1000 OLED and PCH-2000 LCD)
# Uses matched Get/SetDisplayColorSpaceMode exports. Mode changes written by
# VitaBrightEX are read-back verified and exact original state is restored on
# stop only when the plugin actually owns a restoration obligation.
display_color_space_mode = 0

# Historical spellings are compatibility aliases for the SAME verified mode;
# textual last assignment wins. They are not independent saturation/IPS stages.
# lcd_color_space_mode = 0
# lcd_saturation_boost = 0
# lcd_ips_enhance = 0

# PSTV-oriented RGB range registry mutation is deliberately not used on the
# handheld. PCH-2000 internal-panel range remains physical-validation pending.
lcd_rgb_range_mode = 0

# Generic scanout filter requests remain observable through requested/committed
# ABI state, but hardware mutation is unsupported for safe pseudo-v1.4:
# invert (no proven original-state reader), persistent affine CSC/CCT/contrast/
# brightness (restoration not proven), and nonlinear gamma/panel enhancement.
filter_invert = 0
filter_cct = 6500
filter_gamma = 1.0
filter_contrast = 1.0
filter_brightness = 0.0
filter_panel_enhance = 0
