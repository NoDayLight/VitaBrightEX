# VitaBrightEX pseudo-v1.4 configuration
# Search precedence: ur0:tai/vitabrightex.cfg, then ux0:tai/.
# Missing keys return to these defaults on every reload.

# OLED (PCH-1000)
oled_panel_lut_override = 0
# panel_lut_path = ur0:tai/my_custom_lut.txt
oled_dim_workaround = 1

# Legacy v1.3 OLED keys color_r_bias/color_g_bias/color_b_bias and
# night_mode_* are still parsed for backwards-compatible config loading.
# The AMS495QA04 documentation verifies that each 21-byte row contains seven
# RGB gamma-reference triplets, but not the driver IC's per-reference register
# code -> voltage conversion. v1.4 therefore does not apply guessed arithmetic
# directly to those voltage-control codes.

# Panel colour-space (PCH-1000 OLED and PCH-2000 LCD)
# Uses the selected panel driver's matched Get/SetDisplayColorSpaceMode export.
# 0 = preserve the firmware/native mode; 1 = request the alternate mode.
# Writes are session-scoped, read-back verified, and restored on plugin stop.
display_color_space_mode = 0

# Historical spelling accepted as an alias:
# lcd_color_space_mode = 0

# Historical v1.3 names below are parsed for compatibility. saturation_boost
# and ips_enhance request the same verified colour-space mode; they are not
# claimed as separate IPS/transfer-LUT stages.
lcd_saturation_boost = 0
lcd_ips_enhance = 0

# rgb_range_mode is a PSTV-oriented system setting (0 auto / 1 limited /
# 2 full) and is not mutated by this handheld plugin. It remains parsed only
# so old configuration files are harmless.
lcd_rgb_range_mode = 0

# Screen filter
# Hardware invert is verified and session-scoped.
filter_invert = 0

# These ABI-compatible fields remain neutral and are reported unsupported
# until a verified persistent active-scanout CSC / nonlinear transfer stage,
# or an exact OLED gamma-register voltage model, is available.
filter_cct = 6500
filter_gamma = 1.0
filter_contrast = 1.0
filter_brightness = 0.0
filter_panel_enhance = 0
