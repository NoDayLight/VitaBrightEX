# VitaBrightEX pseudo-v1.4 configuration
# Search precedence: ur0:tai/vitabrightex.cfg, then ux0:tai/.
# Missing keys return to these defaults on every reload.

# OLED (PCH-1000)
oled_panel_lut_override = 0
# panel_lut_path = ur0:tai/my_custom_lut.txt
oled_dim_workaround = 1

# Legacy v1.3 OLED keys such as color_*_bias and night_mode_* are still parsed
# for backwards-compatible config loading but are deliberately NOT applied.
# The 21-byte OLED rows are opaque panel-control/calibration data; v1.4 does
# not pretend individual bytes are linear R/G/B samples.

# LCD (PCH-2000)
# The brightness extension does not require colour mutation.
# This is the verified live SceLcd color-space switch and defaults off.
lcd_color_space_mode = 0

# These legacy keys are accepted but do not represent independent processing
# stages in v1.4. Persistent registry RGB-range writes are not performed.
lcd_rgb_range_mode = 0
lcd_saturation_boost = 0
lcd_ips_enhance = 0

# Screen filter
# Hardware invert is currently the only verified generic operation.
filter_invert = 0

# Legacy ABI-compatible fields remain neutral. They are reported unsupported
# until a persistent active-scanout CSC / nonlinear transfer stage is verified.
filter_cct = 6500
filter_gamma = 1.0
filter_contrast = 1.0
filter_brightness = 0.0
filter_panel_enhance = 0
