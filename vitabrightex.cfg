# VitaBrightEX pseudo-v1.4 configuration
# Search precedence is explicit: ur0:tai/vitabrightex.cfg first, then ux0:tai/.
# Missing keys always revert to the defaults below on reload.

# OLED (PCH-1000)
oled_panel_lut_override = 0
# panel_lut_path = ur0:tai/my_custom_lut.txt
color_r_bias = 0
color_g_bias = 0
color_b_bias = 0
night_mode_enabled = 0
night_mode_threshold = 6
oled_dim_workaround = 1

# LCD (PCH-2000)
# Optional colour mutations are OFF by default. The brightness extension does
# not require them. lcd_color_space_mode uses the live SceLcd call when the
# capability resolves. Persistent registry RGB-range writes are intentionally
# not performed by v1.4.
lcd_color_space_mode = 0
lcd_rgb_range_mode = 0
lcd_saturation_boost = 0
lcd_ips_enhance = 0

# Screen filter
# Hardware invert is currently the only verified generic filter operation.
# The remaining parameters stay neutral until a persistent active-scanout CSC
# and nonlinear transfer stage are independently verified.
filter_cct = 6500
filter_gamma = 1.0
filter_contrast = 1.0
filter_brightness = 0.0
filter_invert = 0
filter_panel_enhance = 0
