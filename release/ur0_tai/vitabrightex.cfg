# VitaBrightEX pseudo-v1.4 configuration
# Search precedence: ur0:tai/vitabrightex.cfg, then ux0:tai/.
# Missing keys return to these defaults on every reload.

# OLED (PCH-1000)
oled_panel_lut_override = 0
# panel_lut_path = ur0:tai/my_custom_lut.txt
oled_dim_workaround = 1

# P4/P5 OLED register-domain RGB bias. Each value is a saturating byte-code
# offset applied to the matching R/G/B byte of all seven documented RGB
# reference triplets in every 21-byte LUT row. The file/base LUT remains
# authoritative; hardware receives a derived runtime LUT and persistence writes
# the base only. These are register-code offsets, NOT linear-light gains,
# calibrated white balance, or Kelvin CCT. On P6/unknown panels any non-neutral
# bias request is reported UNSUPPORTED and runtime remains the unmodified base.
color_r_bias = 0
color_g_bias = 0
color_b_bias = 0

# Warm/night profile is intentionally unsupported in pseudo-v1.4 because no
# calibrated per-anchor profile is available. The keys remain parser-compatible
# but night_mode_enabled=1 returns an unsupported capability result; no guessed
# warm transform is applied.
night_mode_enabled = 0
night_mode_threshold = 6

# Panel colour-space (PCH-1000 OLED and PCH-2000 LCD)
# Uses the selected panel driver's matched Get/SetDisplayColorSpaceMode export.
# 0 = preserve the firmware/native mode; 1 = request the alternate mode.
# Writes are session-scoped, read-back verified, and restored on plugin stop.
display_color_space_mode = 0

# Historical spellings are compatibility aliases for the SAME verified mode;
# textual last assignment wins. They are not independent saturation/IPS stages.
# lcd_color_space_mode = 0
# lcd_saturation_boost = 0
# lcd_ips_enhance = 0

# rgb_range_mode is a PSTV-oriented system setting (0 auto / 1 limited /
# 2 full) and is not mutated by this handheld plugin. It remains parsed only
# so old configuration files are harmless. PCH-2000 range behavior is a
# physical-validation item, not a registry-write feature.
lcd_rgb_range_mode = 0

# Generic scanout filters. The ABI retains requested/committed state so old
# configuration remains observable, but pseudo-v1.4 does not mutate these
# domains unless ownership/restoration is proven.
#
# Invert: UNSUPPORTED for mutation. Retail static analysis proves the setter,
# but no trustworthy original-state getter; assuming original=0 is forbidden.
# CCT/contrast/brightness affine CSC: UNSUPPORTED for hardware mutation because
# original IFTU CSC state acquisition/restoration is not sufficiently proven.
# Gamma/panel enhance: UNSUPPORTED; no nonlinear hardware transfer stage proven.
filter_invert = 0
filter_cct = 6500
filter_gamma = 1.0
filter_contrast = 1.0
filter_brightness = 0.0
filter_panel_enhance = 0
