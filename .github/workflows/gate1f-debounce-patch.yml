name: Gate-1F one-shot debounce patch
on:
  push:
    branches: [research-gate1f-ctm-semantics]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Patch held-button carryover
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/gate1f_ctm_semantics/gate1f.c')
          s=p.read_text()
          old='''static uint32_t wait_button(void) {\n    SceCtrlData pad;\n    uint32_t previous = 0;\n    for (;;) {\n        uint32_t pressed;\n        sceKernelPowerTick(SCE_KERNEL_POWER_TICK_DEFAULT);\n        memset(&pad,0,sizeof(pad));\n        sceCtrlPeekBufferPositive(0,&pad,1);\n        pressed = pad.buttons & ~previous;\n        previous = pad.buttons;\n        if (pressed & (SCE_CTRL_LEFT|SCE_CTRL_RIGHT|SCE_CTRL_CROSS|SCE_CTRL_TRIANGLE))\n            return pressed;\n        sceKernelDelayThread(16000);\n    }\n}\n'''
          new='''static uint32_t wait_button(void) {\n    SceCtrlData pad;\n    const uint32_t mask = SCE_CTRL_LEFT|SCE_CTRL_RIGHT|SCE_CTRL_CROSS|SCE_CTRL_TRIANGLE;\n    uint32_t previous = 0;\n    /* A held confirmation from the previous prompt must never answer the next one. */\n    for (;;) {\n        sceKernelPowerTick(SCE_KERNEL_POWER_TICK_DEFAULT);\n        memset(&pad,0,sizeof(pad));\n        sceCtrlPeekBufferPositive(0,&pad,1);\n        if ((pad.buttons & mask) == 0u) break;\n        sceKernelDelayThread(16000);\n    }\n    for (;;) {\n        uint32_t current, pressed;\n        sceKernelPowerTick(SCE_KERNEL_POWER_TICK_DEFAULT);\n        memset(&pad,0,sizeof(pad));\n        sceCtrlPeekBufferPositive(0,&pad,1);\n        current = pad.buttons & mask;\n        pressed = current & ~previous;\n        previous = current;\n        if (pressed) return pressed;\n        sceKernelDelayThread(16000);\n    }\n}\n'''
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('expected wait_button body not found')
          p.write_text(s.replace(old,new,1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'gate1f-ci'
          git config user.email 'gate1f-ci@users.noreply.github.com'
          git add tools/gate1f_ctm_semantics/gate1f.c
          git commit -m 'gate1f: require button release between observations'
          git push origin HEAD:research-gate1f-ctm-semantics
