name: Gate-0 v7 observational candidate
on:
  push:
    branches: [research-lcd-color-engine]
    paths:
      - 'research/diagnostics/gate0_observer/**'
      - 'research/gate0_v7_*'
      - 'research/gate0_trace_decode.py'
      - 'research/gate0_observational_analysis.py'
      - 'research/README-GATE0A.md'
      - 'research/DISPLAY-FEATURE-SCOPE.json'
      - '.github/workflows/gate0-v7-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  VITASDK: /usr/local/vitasdk
  VITASDK_CHANNEL: '2026.08'
  VDPM_NONINTERACTIVE: 1
  PUP_URL: https://web.archive.org/web/20180630222648id_/http://dus01.psp2.update.playstation.net/update/psp2/image/2017_0317/rel_0a0f2a9ae58968ac5d1d2127049c3cba/PSP2UPDAT.PUP
  PUP_SHA256: 86859b3071681268b6d0beb5ef691da874b6726e85b6f06a1cdf6a0e183e77c6
  SCEUTILS_SHA: 0466d003246ec986ab6189e6719dcb196a40fb02
  PY2_IMAGE: python@sha256:d8fac68ebdc45b8d66d53f1ed6c1532da81109a8f5532a6ca0c951ed31107d70
  VDPM_SHA: c83b88a54ec13372515eeb8b3bdca4b10c36d721
  TAIHEN_SHA: 309b3800bcb8ebbd5e4f5e5e920af3da3590b829
  VITA_HEADERS_SHA: 5e1e7d38d766e4c1634a77f6e5249caab8c8f9cb
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Exact checkout and host safety contracts
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          python3 research/display_feature_scope_audit.py --manifest research/DISPLAY-FEATURE-SCOPE.json --json display-feature-scope-contract.json
          python3 research/gate0_v7_source_audit.py | tee observer-safety-report.txt
          python3 -m py_compile research/gate0_trace_decode.py research/gate0_observational_analysis.py research/gate0_v7_retail_audit.py research/gate0_v7_taihen_audit.py research/gate0_v7_synthetic_tests.py
          cc -std=c99 -Wall -Wextra -Werror -pthread -Iresearch research/gate0_v7_lifecycle_host.c -o gate0-v7-lifecycle-host
          ./gate0-v7-lifecycle-host | tee lifecycle-host-report.txt
          cat >/tmp/protocol_abi.c <<'C'
          #include "research/diagnostics/gate0_observer/gate0_protocol_v7.h"
          #include <stddef.h>
          int main(void){return !(VBE_TRACE_VERSION==7u&&VBE_TRACE_RECORD_CAPACITY==512u&&sizeof(VbeTraceRecord)==128u&&sizeof(VbeTraceStatus)==72u&&sizeof(VbeTraceDumpHeader)==64u&&offsetof(VbeTraceRecord,payload)==64u);}
          C
          cc -std=c99 -Wall -Wextra -Werror -I. /tmp/protocol_abi.c -o /tmp/protocol_abi && /tmp/protocol_abi
          (cd research && python3 gate0_v7_synthetic_tests.py)
      - name: Fetch pinned SDK, vita-headers and taiHEN evidence
        run: |
          set -euxo pipefail
          git init -q vdpm && git -C vdpm remote add origin https://github.com/vitasdk/vdpm.git && git -C vdpm fetch -q --depth 1 origin "$VDPM_SHA" && git -C vdpm checkout -q --detach FETCH_HEAD
          git init -q taihen-audit && git -C taihen-audit remote add origin https://github.com/yifanlu/taiHEN.git && git -C taihen-audit fetch -q --depth 1 origin "$TAIHEN_SHA" && git -C taihen-audit checkout -q --detach FETCH_HEAD
          git init -q vita-headers-audit && git -C vita-headers-audit remote add origin https://github.com/vitasdk/vita-headers.git && git -C vita-headers-audit fetch -q --depth 1 origin "$VITA_HEADERS_SHA" && git -C vita-headers-audit checkout -q --detach FETCH_HEAD
          test "$(git -C vdpm rev-parse HEAD)" = "$VDPM_SHA"; test "$(git -C taihen-audit rev-parse HEAD)" = "$TAIHEN_SHA"; test "$(git -C vita-headers-audit rev-parse HEAD)" = "$VITA_HEADERS_SHA"
          grep -F 'ksceIftuEnable: 0x0D7C02F7' vita-headers-audit/db/360/SceLowio.yml
          ! grep -F 'ksceIftuEnable' vita-headers-audit/include/psp2kern/lowio/iftu.h
          python3 research/gate0_v7_taihen_audit.py --patches taihen-audit/patches.c --header taihen-audit/include/taihen.h --text taihen-semantics-report.txt
          grep -F 'INSTALL_PUBLICATION_CLASSIFICATION=UPSTREAM_TAIHEN_RESIDUAL_RISK' taihen-semantics-report.txt
          test "$(grep -c 'taiHookReleaseForKernel' research/diagnostics/gate0_observer/main.c || true)" = 0
      - name: Recover exact retail 3.65 and prove observer ABI
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 "$PUP_URL" -o PSP2UPDAT-365.PUP
          echo "$PUP_SHA256  PSP2UPDAT-365.PUP" | sha256sum -c -
          sudo apt-get update && sudo apt-get install -y mtools file
          python3 -m pip install --disable-pip-version-check --user capstone==5.0.3
          git init -q sceutils-audit && git -C sceutils-audit remote add origin https://github.com/RealYoti/sceutils.git && git -C sceutils-audit fetch -q --depth 1 origin "$SCEUTILS_SHA" && git -C sceutils-audit checkout -q --detach FETCH_HEAD
          cp sceutils-audit/keys_external.py sceutils-audit/keys.py; mkdir -p sceutils-audit/unarzl; : > sceutils-audit/unarzl/unarzl
          cat > extract_fw.py <<'PY'
          import os,sys
          sys.path.insert(0,'sceutils-audit');import pup_fiction
          os.makedirs('fw/PUP');os.makedirs('fw/PUP_dec');pup_fiction.pup_extract_files('PSP2UPDAT-365.PUP','fw/PUP');pup_fiction.pup_decrypt_packages('fw/PUP','fw/PUP_dec')
          PY
          docker run --rm -v "$PWD:/work" -w /work "$PY2_IMAGE" bash -lc "pip install --disable-pip-version-check pycryptodome==3.9.9 enum34==1.1.10 >/dev/null && python extract_fw.py"
          sudo chown -R "$(id -u):$(id -g)" fw
          echo '35480a01ea783df859326d8698831afd3e850717f5b7785ab9964eab23712856  fw/PUP_dec/os0.bin' | sha256sum -c -
          mkdir -p fw/os0-tree fw/raw fw/elf; mcopy -s -n -i fw/PUP_dec/os0.bin '::/kd' fw/os0-tree
          for base in lcd lowio; do src="$(find fw/os0-tree -type f -iname "$base.skprx" -print -quit)"; test -n "$src"; cp "$src" "fw/raw/$base.skprx"; done
          docker run --rm -v "$PWD:/work" -w /work "$PY2_IMAGE" bash -lc 'pip install --disable-pip-version-check pycryptodome==3.9.9 enum34==1.1.10 >/dev/null; for base in lcd lowio; do python sceutils-audit/self2elf.py -i "fw/raw/$base.skprx" -o "fw/elf/$base.elf" >/dev/null; done'
          sudo chown -R "$(id -u):$(id -g)" fw/elf
          echo '24752bb4c69f0c241701cab0364cde9cbe5c95128b6bfe02bf3263aad524246e  fw/elf/lcd.elf' | sha256sum -c -
          echo 'f791cfe2c6db955deb9446c57bb72ce1870bde2c6c485cac363e343d5128f744  fw/elf/lowio.elf' | sha256sum -c -
          python3 research/gate0_v7_retail_audit.py --lowio fw/elf/lowio.elf --lcd fw/elf/lcd.elf --json retail-trace-abi-report.json --text retail-trace-abi-report.txt
          grep -F 'GATE0_V7_RETAIL_ABI=PASS' retail-trace-abi-report.txt
      - name: Bootstrap pinned VitaSDK series and build under Werror
        run: |
          set -euxo pipefail
          bash vdpm/bootstrap-vitasdk.sh
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          "$VITASDK/bin/vdpm" install taihen
          "$VITASDK/libexec/vdpm/pacman" -Q taihen | tee taihen-package.txt
          grep -F 'taihen 0.11-1' taihen-package.txt
          cat "$VITASDK/version_info.txt" | tee vitasdk-version.txt
          cmake -S research/diagnostics/gate0_observer -B gate0-v7-build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
          cmake --build gate0-v7-build --parallel
          test -s gate0-v7-build/vbe_color_trace.skprx; test -s gate0-v7-build/vbe_color_trace_drain.self; test -s gate0-v7-build/vbe_color_trace_drain.vpk
      - name: Assemble exact v7 package
        run: |
          set -euxo pipefail
          mkdir gate0-v7-package
          cp gate0-v7-build/vbe_color_trace.skprx gate0-v7-build/vbe_color_trace_drain.self gate0-v7-build/vbe_color_trace_drain.vpk gate0-v7-package/
          cp research/diagnostics/gate0_observer/gate0_protocol_v7.h research/diagnostics/gate0_observer/retail_365_layout.h research/diagnostics/gate0_observer/observer_lifecycle_core.h gate0-v7-package/
          cp research/gate0_trace_decode.py research/gate0_observational_analysis.py research/DISPLAY-FEATURE-SCOPE.json research/README-GATE0A.md gate0-v7-package/
          cp observer-safety-report.txt lifecycle-host-report.txt retail-trace-abi-report.txt retail-trace-abi-report.json taihen-semantics-report.txt display-feature-scope-contract.json vitasdk-version.txt taihen-package.txt gate0-v7-package/
          printf '%s\n' "$GITHUB_SHA" > gate0-v7-package/WORKFLOW_COMMIT.txt
          printf 'workflow_commit=%s\nvdpm_commit=%s\ntaihen_source_commit=%s\nvita_headers_commit=%s\npup_sha256=%s\nSceLowio_sha256=f791cfe2c6db955deb9446c57bb72ce1870bde2c6c485cac363e343d5128f744\nSceLcd_sha256=24752bb4c69f0c241701cab0364cde9cbe5c95128b6bfe02bf3263aad524246e\nbroad_research_run=34828421201\nbroad_research_classification=UNRELATED_TO_GATE0_SAFETY\n' "$GITHUB_SHA" "$VDPM_SHA" "$TAIHEN_SHA" "$VITA_HEADERS_SHA" "$PUP_SHA256" > gate0-v7-package/research-provenance.txt
          (cd gate0-v7-package && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
          test "$(cat gate0-v7-package/WORKFLOW_COMMIT.txt)" = "$GITHUB_SHA"
      - name: Upload exact Gate-0 v7 candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vbe-gate0-v7-${{ github.sha }}
          path: gate0-v7-package/
          if-no-files-found: error
          compression-level: 6
  independent-verify:
    needs: candidate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact artifact and independently rehash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
        run: |
          set -euxo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > gate0-v7.zip
          archive_sha="$(sha256sum gate0-v7.zip | cut -d' ' -f1)"; test "sha256:$archive_sha" = "$EXPECTED_DIGEST"
          mkdir unpacked; unzip -q gate0-v7.zip -d unpacked
          test "$(cat unpacked/WORKFLOW_COMMIT.txt)" = "$GITHUB_SHA"; (cd unpacked && sha256sum -c SHA256SUMS)
          grep -F '#define VBE_TRACE_VERSION 7u' unpacked/gate0_protocol_v7.h; grep -F '#define VBE_TRACE_RECORD_SIZE 128u' unpacked/gate0_protocol_v7.h
          printf 'artifact_id=%s\ngithub_digest=%s\narchive_sha256=%s\nworkflow_commit=%s\nskprx_sha256=%s\ndrain_vpk_sha256=%s\nSHA256SUMS_verification=PASS\n' "$ARTIFACT_ID" "$EXPECTED_DIGEST" "$archive_sha" "$(cat unpacked/WORKFLOW_COMMIT.txt)" "$(sha256sum unpacked/vbe_color_trace.skprx|cut -d' ' -f1)" "$(sha256sum unpacked/vbe_color_trace_drain.vpk|cut -d' ' -f1)" | tee independent-verification.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vbe-gate0-v7-independent-${{ github.sha }}
          path: independent-verification.txt
          if-no-files-found: error
