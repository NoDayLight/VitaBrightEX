name: Gate-1F one-shot signed-probe patch
on:
  push:
    branches: [research-gate1f-ctm-semantics]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Make negative probe use non-clipping GRAY50 reference
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/gate1f_ctm_semantics/gate1f.c')
          s=p.read_text()
          s=s.replace('#define OBS_NONE 5u\n', '#define OBS_NONE 5u\n#define OBS_GRAY50 6u\n')
          s=s.replace('static const char *const n[] = {"INVALID","R","G","B","MIXED","NONE"};', 'static const char *const n[] = {"INVALID","R","G","B","MIXED","NONE","GRAY50"};')
          old='''static int collect_observation(const Probe *p, Observation *o) {\n    static const char *const rgb[] = {"R","G","B","MIXED","NONE"};\n    static const char *const dir[] = {"INCREASE","DECREASE","OTHER","NONE"};\n    static const char *const iso[] = {"YES","NO","AMBIG"};\n    int v;\n    snprintf(g_probe_title,sizeof(g_probe_title),"PROBE %s",p->id);\n    v=choose("PURE PRIMARY PATCH CHANGED",rgb,5); if(v<0)return -1; o->patch=(uint32_t)v+1u;\n    v=choose("PHYSICAL COMPONENT CHANGED",rgb,5); if(v<0)return -1; o->component=(uint32_t)v+1u;\n    v=choose("DIRECTION OF COMPONENT",dir,4); if(v<0)return -1; o->direction=(uint32_t)v+1u;\n    v=choose("IS RESPONSE ISOLATED",iso,3); if(v<0)return -1; o->isolated=(uint32_t)v+1u;\n    return 0;\n}\n\nstatic int run_probe(const Probe *p, Observation *o) {'''
          new='''static int collect_observation(const Probe *p, Observation *o) {\n    static const char *const rgb[] = {"R","G","B","MIXED","NONE"};\n    static const char *const dir[] = {"INCREASE","DECREASE","OTHER","NONE"};\n    static const char *const iso[] = {"YES","NO","AMBIG"};\n    int v;\n    snprintf(g_probe_title,sizeof(g_probe_title),"PROBE %s",p->id);\n    v=choose("PURE PRIMARY PATCH CHANGED",rgb,5); if(v<0)return -1; o->patch=(uint32_t)v+1u;\n    v=choose("PHYSICAL COMPONENT CHANGED",rgb,5); if(v<0)return -1; o->component=(uint32_t)v+1u;\n    v=choose("DIRECTION OF COMPONENT",dir,4); if(v<0)return -1; o->direction=(uint32_t)v+1u;\n    v=choose("IS RESPONSE ISOLATED",iso,3); if(v<0)return -1; o->isolated=(uint32_t)v+1u;\n    return 0;\n}\n\nstatic int collect_signed_observation(const Probe *p, Observation *o) {\n    static const char *const rgb[] = {"R","G","B","MIXED","NONE"};\n    static const char *const dir[] = {"INCREASE","DECREASE","OTHER","NONE"};\n    static const char *const iso[] = {"YES","NO","AMBIG"};\n    int v;\n    snprintf(g_probe_title,sizeof(g_probe_title),"SIGNED %s",p->id);\n    o->patch=OBS_GRAY50;\n    v=choose("GRAY50 COMPONENT CHANGED",rgb,5); if(v<0)return -1; o->component=(uint32_t)v+1u;\n    v=choose("DIRECTION OF COMPONENT",dir,4); if(v<0)return -1; o->direction=(uint32_t)v+1u;\n    v=choose("IS RESPONSE ISOLATED",iso,3); if(v<0)return -1; o->isolated=(uint32_t)v+1u;\n    return 0;\n}\n\nstatic int run_probe(const Probe *p, Observation *o, int signed_probe) {'''
          if old not in s: raise SystemExit('collector block not found')
          s=s.replace(old,new,1)
          s=s.replace('if(collect_observation(p,o)<0) return -3;', 'if((signed_probe ? collect_signed_observation(p,o) : collect_observation(p,o))<0) return -3;',1)
          s=s.replace('ret=run_probe(&k_basis_probes[i],&g_obs[i]);', 'ret=run_probe(&k_basis_probes[i],&g_obs[i],0);')
          s=s.replace('ret=run_probe(&neg,&g_obs[9]);', 'ret=run_probe(&neg,&g_obs[9],1);')
          p.write_text(s)

          p=Path('tools/gate1f_ctm_semantics/decode.py')
          s=p.read_text()
          old="""signed_ok=(po['patch']==no['patch'] and po['component']==no['component'] and\n               po['isolated']=='YES' and no['isolated']=='YES' and\n               po['direction']=='INCREASE' and no['direction']=='DECREASE')"""
          new="""signed_ok=(no['patch']=='GRAY50' and po['component']==no['component'] and\n               po['isolated']=='YES' and no['isolated']=='YES' and\n               po['direction']=='INCREASE' and no['direction']=='DECREASE')"""
          if old not in s: raise SystemExit('decoder signed check not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'gate1f-ci'
          git config user.email 'gate1f-ci@users.noreply.github.com'
          git add tools/gate1f_ctm_semantics/gate1f.c tools/gate1f_ctm_semantics/decode.py
          git commit -m 'gate1f: use GRAY50 for signed cross-term proof'
          git push origin HEAD:research-gate1f-ctm-semantics
