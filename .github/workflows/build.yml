name: VitaSDK build

on:
  push:
    branches:
      - v1.4-rearchitecture
  pull_request:

permissions:
  contents: read

env:
  VITASDK: /usr/local/vitasdk
  VDPM_NONINTERACTIVE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify pseudo-v1.4 source contract
        run: python3 tools/verify_source_contract.py
      - name: Verify parser/runtime/CI contract
        run: python3 tools/verify_parser_contract.py
      - name: Validate packaged LUT/config assets with production parser
        run: python3 tools/validate_packaged_assets.py
      - name: Validate firmware-audit tooling
        run: python3 -m py_compile tools/verify_scelcd_layout.py
      - uses: actions/checkout@v7
        with:
          repository: vitasdk/vdpm
          path: vdpm
      - name: Bootstrap VitaSDK
        run: |
          bash vdpm/bootstrap-vitasdk.sh
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          vdpm install taihen
          vdpm install libvita2d
      - name: Configure release plugin
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DENABLE_LOGGING=OFF
      - name: Build release plugin and stubs
        run: cmake --build build --parallel
      - name: Configure diagnostic plugin
        run: cmake -S . -B build-diagnostic -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DENABLE_LOGGING=ON
      - name: Build diagnostic plugin
        run: cmake --build build-diagnostic --parallel
      - name: Install generated syscall stubs
        run: cmake --install build --prefix "$VITASDK/arm-vita-eabi"
      - name: Configure editor
        run: cmake -S editor -B editor-build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
      - name: Build editor
        run: cmake --build editor-build --parallel
      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: VitaBrightEX-v1.4-plugin
          path: build/vitabright.skprx
      - name: Upload editor
        uses: actions/upload-artifact@v7
        with:
          name: VitaBrightEX-v1.4-editor
          path: editor-build/vitabrightex-editor.vpk
