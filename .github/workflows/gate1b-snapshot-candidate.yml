name: Gate-1B lifecycle snapshot candidate

on:
  push:
    branches: [research-gate1b-stage-semantics]
    paths:
      - 'research/diagnostics/gate1b_snapshot/**'
      - 'research/gate1b_snapshot_decode.py'
      - '.github/workflows/gate1b-snapshot-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  VITASDK: /usr/local/vitasdk
  VDPM_NONINTERACTIVE: 1
  VDPM_SHA: c83b88a54ec13372515eeb8b3bdca4b10c36d721
  TAIHEN_SHA: 309b3800bcb8ebbd5e4f5e5e920af3da3590b829
  VITA_HEADERS_SHA: 5e1e7d38d766e4c1634a77f6e5249caab8c8f9cb
  STATIC_SEMANTICS_HEAD: 5723672e9c9f75140df51ee8b2df0aae5dfbac5a
  STATIC_SEMANTICS_RUN: '35014928004'
  STATIC_SEMANTICS_ARTIFACT: '10415401868'
  STATIC_SEMANTICS_DIGEST: fb6faaf351d6e12a91916b47ffebf4360e6c84f3d01def3ac6aaa5c9f61d8e3f

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      skprx_sha: ${{ steps.hashes.outputs.skprx_sha }}
      decoder_sha: ${{ steps.hashes.outputs.decoder_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Exact head and lifecycle read-only source contract
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          python3 -m py_compile research/gate1b_snapshot_decode.py
          python3 research/gate1b_snapshot_decode.py --self-test | tee gate1b-snapshot-decoder-selftest.txt
          grep -F 'GATE1B_SNAPSHOT_DECODER_SELFTEST=PASS' gate1b-snapshot-decoder-selftest.txt
          python3 - <<'PY' | tee gate1b-snapshot-source-safety.txt
          from pathlib import Path
          import re
          s=Path('research/diagnostics/gate1b_snapshot/main.c').read_text()
          forbidden=['taiInject','ksceIftuCsc','ksceIftuDisable','ksceLcd','sceIo','ksceIo','taiHookRelease','taiInjectRelease']
          bad=[x for x in forbidden if x in s]
          assert not bad, bad
          assert s.count('module_get_offset(')==2
          assert s.count('taiHookFunctionExportForKernel(')==1
          assert s.count('TAI_CONTINUE(')==1
          assert 'NID_IFTU_ENABLE 0x0D7C02F7u' in s
          assert 'ksceKernelRegisterSysEventHandler("vbe_gate1b_snapshot"' in s
          assert 'VBE_G1B_SYS_EVENT_SUSPEND_RESUME' in s
          assert 'LIVE_CSC_CONTROL_OFFSET 0x100u' in s
          assert 'CACHE_A_OFFSET 0x10Cu' in s and 'CACHE_B_OFFSET 0x148u' in s
          assert 'ENABLE_STATE_OFFSET 0x1E8u' in s and 'PRIVATE_CONTROL_OFFSET 0x1F8u' in s
          assert 'known_iftu_mmio(mmio)' in s
          assert 'publish_pre_suspend();' in s
          assert 'VBE_G1B_CAPTURE_POST_RESUME_ENABLE_P1' in s
          # The only volatile pointer store is zero_bytes() writing plugin-owned memory.
          writes=re.findall(r'\*\s*\([^;\n]*volatile[^;\n]*\)\s*=',s)
          assert not writes, writes
          print('GATE1B_SNAPSHOT_SOURCE_SAFETY=PASS')
          print('ONE_ENABLE_HOOK_ONLY=PASS')
          print('SONY_CALLED_EXACTLY_ONCE=PASS')
          print('NO_DISPLAY_OR_IFTU_MUTATION=PASS')
          print('NO_HOOK_TIME_IO=PASS')
          print('NO_RUNTIME_TAIHEN_RELEASE=PASS')
          print('MMIO_READ_WHITELIST=PASS')
          print('LOWIO_SEGMENT_OFFSETS=PASS')
          print('SUSPEND_RESUME_TRIGGER=PASS')
          PY
          cat >/tmp/g1babi.c <<'C'
          #include "research/diagnostics/gate1b_snapshot/gate1b_snapshot_protocol.h"
          #include <stddef.h>
          int main(void){return !(
            VBE_G1B_VERSION==2u &&
            sizeof(VbeG1bPlaneSnapshot)==152u &&
            sizeof(VbeG1bSnapshot)==344u &&
            sizeof(VbeG1bCaptureStatus)==64u &&
            sizeof(VbeG1bCaptureBundle)==784u &&
            offsetof(VbeG1bPlaneSnapshot,cache_a)==32u &&
            offsetof(VbeG1bPlaneSnapshot,cache_b)==92u &&
            offsetof(VbeG1bSnapshot,planes)==40u &&
            offsetof(VbeG1bCaptureBundle,status)==32u &&
            offsetof(VbeG1bCaptureBundle,snapshots)==96u &&
            VBE_G1B_LOWIO_SEGMENT==1u &&
            VBE_G1B_PLANE0_OFFSET==0x37Cu &&
            VBE_G1B_PLANE1_OFFSET==0x590u &&
            VBE_G1B_SYS_EVENT_SUSPEND_RESUME==0x00100000u
          );}
          C
          cc -std=c99 -Wall -Wextra -Werror -I. /tmp/g1babi.c -o /tmp/g1babi
          /tmp/g1babi
          echo 'GATE1B_SNAPSHOT_PROTOCOL_ABI=PASS' | tee gate1b-snapshot-protocol-abi.txt

      - name: Fetch pinned SDK sources
        run: |
          set -euxo pipefail
          git init -q vdpm
          git -C vdpm remote add origin https://github.com/vitasdk/vdpm.git
          git -C vdpm fetch -q --depth 1 origin "$VDPM_SHA"
          git -C vdpm checkout -q --detach FETCH_HEAD
          git init -q taihen-audit
          git -C taihen-audit remote add origin https://github.com/yifanlu/taiHEN.git
          git -C taihen-audit fetch -q --depth 1 origin "$TAIHEN_SHA"
          git -C taihen-audit checkout -q --detach FETCH_HEAD
          git init -q vita-headers-audit
          git -C vita-headers-audit remote add origin https://github.com/vitasdk/vita-headers.git
          git -C vita-headers-audit fetch -q --depth 1 origin "$VITA_HEADERS_SHA"
          git -C vita-headers-audit checkout -q --detach FETCH_HEAD
          test "$(git -C vdpm rev-parse HEAD)" = "$VDPM_SHA"
          test "$(git -C taihen-audit rev-parse HEAD)" = "$TAIHEN_SHA"
          test "$(git -C vita-headers-audit rev-parse HEAD)" = "$VITA_HEADERS_SHA"

      - name: Bootstrap pinned VitaSDK and build under Werror
        run: |
          set -euxo pipefail
          bash vdpm/bootstrap-vitasdk.sh
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          "$VITASDK/bin/vdpm" install taihen
          "$VITASDK/bin/vdpm" list taihen | tee taihen-package.txt
          cmake -S research/diagnostics/gate1b_snapshot -B gate1b-snapshot-build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
          cmake --build gate1b-snapshot-build --parallel
          test -s gate1b-snapshot-build/vbe_gate1b_snapshot.skprx
          test -s gate1b-snapshot-build/vbe_gate1b_snapshot.self
          test -s gate1b-snapshot-build/vbe_gate1b_snapshot.vpk
          python3 research/gate0_v7_import_manifest.py gate1b-snapshot-build/vbe_gate1b_snapshot_kernel.velf \
            --nid-db vita-headers-audit/db/360 --nid-db vita-headers-audit/db/363 \
            --output gate1b-snapshot-imports.txt
          cat gate1b-snapshot-imports.txt
          ! grep -F 'library=SceModulemgrForKernel' gate1b-snapshot-imports.txt
          ! grep -F 'library=SceLowio' gate1b-snapshot-imports.txt
          ! grep -F 'SceIftuForDriver' gate1b-snapshot-imports.txt
          ! grep -F 'SceLcd' gate1b-snapshot-imports.txt
          grep -F 'library=SceModulemgrForDriver' gate1b-snapshot-imports.txt
          grep -F 'library=SceKernelSuspendForDriver' gate1b-snapshot-imports.txt
          grep -F 'library=taihenForKernel' gate1b-snapshot-imports.txt
          grep -F 'library=taihenModuleUtils' gate1b-snapshot-imports.txt

      - name: Package exact lifecycle snapshot candidate
        id: hashes
        run: |
          set -euxo pipefail
          rm -rf gate1b-snapshot-package
          mkdir -p gate1b-snapshot-package/include
          cp gate1b-snapshot-build/vbe_gate1b_snapshot.skprx gate1b-snapshot-package/
          cp gate1b-snapshot-build/vbe_gate1b_snapshot.self gate1b-snapshot-package/
          cp gate1b-snapshot-build/vbe_gate1b_snapshot.vpk gate1b-snapshot-package/
          cp research/gate1b_snapshot_decode.py gate1b-snapshot-package/
          cp research/diagnostics/gate1b_snapshot/gate1b_snapshot_protocol.h gate1b-snapshot-package/include/
          cp gate1b-snapshot-source-safety.txt gate1b-snapshot-decoder-selftest.txt gate1b-snapshot-protocol-abi.txt gate1b-snapshot-imports.txt gate1b-snapshot-package/
          printf '%s\n' "$GITHUB_SHA" > gate1b-snapshot-package/WORKFLOW_COMMIT.txt
          printf '%s\n' \
            "workflow=Gate-1B lifecycle snapshot candidate" \
            "commit=$GITHUB_SHA" \
            "firmware=3.65" \
            "static_semantics_head=$STATIC_SEMANTICS_HEAD" \
            "static_semantics_run=$STATIC_SEMANTICS_RUN" \
            "static_semantics_artifact=$STATIC_SEMANTICS_ARTIFACT" \
            "static_semantics_digest=$STATIC_SEMANTICS_DIGEST" \
            "capture=pre-suspend system event + post-resume active/event-or-enable-p1" \
            "sys_event=0x00100000" \
            "lowio_segment=1" \
            "plane0_offset=0x37C" \
            "plane1_offset=0x590" \
            > gate1b-snapshot-package/BUILD-METADATA.txt
          (cd gate1b-snapshot-package && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          skprx_sha="$(sha256sum gate1b-snapshot-package/vbe_gate1b_snapshot.skprx | awk '{print $1}')"
          decoder_sha="$(sha256sum gate1b-snapshot-package/gate1b_snapshot_decode.py | awk '{print $1}')"
          echo "skprx_sha=$skprx_sha" >> "$GITHUB_OUTPUT"
          echo "decoder_sha=$decoder_sha" >> "$GITHUB_OUTPUT"
          echo "SKPRX_SHA256=$skprx_sha"
          echo "DECODER_SHA256=$decoder_sha"
          cat gate1b-snapshot-package/SHA256SUMS

      - name: Upload exact snapshot artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vbe-gate1b-lifecycle-snapshot-${{ github.sha }}
          path: gate1b-snapshot-package/
          if-no-files-found: error
          compression-level: 6

  independent-verify:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
      EXPECTED_SKPRX: ${{ needs.candidate.outputs.skprx_sha }}
      EXPECTED_DECODER: ${{ needs.candidate.outputs.decoder_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact artifact and independently verify
        run: |
          set -euxo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o gate1b-snapshot-artifact.zip
          digest="${ARTIFACT_DIGEST#sha256:}"
          echo "$digest  gate1b-snapshot-artifact.zip" | sha256sum -c -
          unzip -q gate1b-snapshot-artifact.zip -d verify
          commit_file="$(find verify -name WORKFLOW_COMMIT.txt -print -quit)"
          test -n "$commit_file"
          pkg="$(dirname "$commit_file")"
          test "$(cat "$commit_file")" = "$GITHUB_SHA"
          (cd "$pkg" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$pkg/vbe_gate1b_snapshot.skprx" | awk '{print $1}')" = "$EXPECTED_SKPRX"
          test "$(sha256sum "$pkg/gate1b_snapshot_decode.py" | awk '{print $1}')" = "$EXPECTED_DECODER"
          grep -F 'GATE1B_SNAPSHOT_SOURCE_SAFETY=PASS' "$pkg/gate1b-snapshot-source-safety.txt"
          grep -F 'ONE_ENABLE_HOOK_ONLY=PASS' "$pkg/gate1b-snapshot-source-safety.txt"
          grep -F 'SONY_CALLED_EXACTLY_ONCE=PASS' "$pkg/gate1b-snapshot-source-safety.txt"
          grep -F 'NO_DISPLAY_OR_IFTU_MUTATION=PASS' "$pkg/gate1b-snapshot-source-safety.txt"
          grep -F 'NO_HOOK_TIME_IO=PASS' "$pkg/gate1b-snapshot-source-safety.txt"
          grep -F 'NO_RUNTIME_TAIHEN_RELEASE=PASS' "$pkg/gate1b-snapshot-source-safety.txt"
          grep -F 'GATE1B_SNAPSHOT_PROTOCOL_ABI=PASS' "$pkg/gate1b-snapshot-protocol-abi.txt"
          ! grep -F 'library=SceModulemgrForKernel' "$pkg/gate1b-snapshot-imports.txt"
          ! grep -F 'library=SceLowio' "$pkg/gate1b-snapshot-imports.txt"
          python3 "$pkg/gate1b_snapshot_decode.py" --self-test
          echo 'GATE1B_SNAPSHOT_INDEPENDENT_VERIFY=PASS'
          echo "ARTIFACT_ID=$ARTIFACT_ID"
          echo "ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          echo "SKPRX_SHA256=$EXPECTED_SKPRX"
          echo "DECODER_SHA256=$EXPECTED_DECODER"
