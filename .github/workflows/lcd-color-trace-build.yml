name: LCD color trace diagnostic build

on:
  push:
    branches:
      - research-lcd-color-engine
  workflow_dispatch:

permissions:
  contents: read

env:
  VITASDK: /usr/local/vitasdk
  VDPM_NONINTERACTIVE: 1

jobs:
  build-trace-v5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vitasdk/vdpm
          ref: c83b88a54ec13372515eeb8b3bdca4b10c36d721
          path: vdpm

      - name: Run exact protocol-v5 host evidence tests
        run: |
          set -euxo pipefail
          python3 -m py_compile research/gate0_trace_decode.py research/gate0_decision_audit.py research/gate0_trace_synthetic_tests.py
          python3 research/gate0_trace_synthetic_tests.py | tee gate0-host-tests.txt
          grep -F 'gate0 synthetic tests: 21 PASS' gate0-host-tests.txt
          cat > /tmp/vbe_trace_abi_host.c <<'EOF'
          #include "research/diagnostics/iftu_csc_trace/trace_protocol.h"
          int main(void) { return 0; }
          EOF
          cc -std=c99 -Wall -Wextra -Werror -I. /tmp/vbe_trace_abi_host.c -o /tmp/vbe_trace_abi_host
          /tmp/vbe_trace_abi_host

      - name: Bootstrap pinned VitaSDK
        run: |
          set -euxo pipefail
          test "$(git -C vdpm rev-parse HEAD)" = c83b88a54ec13372515eeb8b3bdca4b10c36d721
          bash vdpm/bootstrap-vitasdk.sh
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          "$VITASDK/bin/vdpm" install taihen

      - name: Assert read-only transactional trace-v5 contract
        run: |
          set -euxo pipefail
          p=research/diagnostics/iftu_csc_trace/main.c
          h=research/diagnostics/iftu_csc_trace/trace_protocol.h
          l=research/diagnostics/iftu_csc_trace/layout_365.h
          d=research/diagnostics/iftu_csc_trace/drain_core.inc
          grep -F '#define VBE_TRACE_VERSION                 5u' "$h"
          grep -F '#define VBE_TRACE_RECORD_SIZE             304u' "$h"
          grep -F '#define VBE_TRACE_STATUS_SIZE             68u' "$h"
          grep -F '#define VBE_TRACE_SNAPSHOT_SIZE           720u' "$h"
          grep -F '#define VBE_TRACE_DUMP_HEADER_SIZE        108u' "$h"
          grep -F '#define VBE_TRACE_RECORD_PAYLOAD_OFFSET   48u' "$h"
          grep -F 'completion_sequence' "$h"
          grep -F 'thread_id' "$h"
          grep -F 'invocation_id' "$h"
          grep -F 'raw_return' "$h"
          grep -F 'VBE_TRACE_FLAG_RETURN_VALID' "$h"
          grep -F 'offsetof(VbeTraceRecord, payload) == VBE_TRACE_RECORD_PAYLOAD_OFFSET' "$h"
          grep -F 'VBE_LCD_PANEL_WRITER_OFFSET       0xA54u' "$l"
          grep -F 'VBE_LCD_PANEL_READER_OFFSET       0x5B4u' "$l"
          grep -F 'VBE_LCD_STATE_OFFSET              0xA0u' "$l"
          grep -F 'vbe_lcd_panel_writer_signature' "$l"
          grep -F 'vbe_lcd_panel_reader_signature' "$l"
          grep -F 'prepare_csc' "$p"
          grep -F 'prepare_panel_write' "$p"
          grep -F 'finish_raw_call' "$p"
          grep -F 'ksceKernelGetThreadId' "$p"
          grep -F 'g_enabled = 0;' "$p"
          grep -F 'if (g_active_hooks != 0u) return VBE_TRACE_ERR_BUSY;' "$p"
          grep -F 'release_owned_hook' "$p"
          grep -F 'snapshot_data_read(&a, available);' "$p"
          grep -F 'snapshot_data_read(&b, available);' "$p"
          grep -F 'validate_invocations' "$d"
          grep -F 'completion_sequence' "$d"
          grep -F 'matching_enter' "$d"
          grep -F 'matching_exit' "$d"
          ! grep -E 'ksceIo|sceIo|snprintf|printf|malloc|calloc|realloc|ksceKernelAlloc|CreateThread|CreateTimer|DelayThread|Wait' "$p"
          ! grep -E 'taiInject|SetDisplayColorSpace|SetBrightness' "$p"
          ! grep -E '0x8100B37C|0x81000A54|0x810005B4|0x810020A0' "$p"

      - name: Build v5 kernel observer and user drain with Werror
        run: |
          set -euxo pipefail
          cmake -S research/diagnostics/iftu_csc_trace -B trace-build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
          cmake --build trace-build --parallel
          test -s trace-build/vbe_color_trace.skprx
          test -s trace-build/vbe_color_trace_drain.self
          test -s trace-build/vbe_color_trace_drain.vpk

      - name: Assemble and verify self-contained Gate-0 package
        run: |
          set -euxo pipefail
          rm -rf gate0-package
          mkdir gate0-package
          cp trace-build/vbe_color_trace.skprx gate0-package/
          cp trace-build/vbe_color_trace_drain.self gate0-package/
          cp trace-build/vbe_color_trace_drain.vpk gate0-package/
          cp research/diagnostics/iftu_csc_trace/trace_protocol.h gate0-package/
          cp research/diagnostics/iftu_csc_trace/layout_365.h gate0-package/
          cp research/gate0_trace_decode.py gate0-package/
          cp research/gate0_decision_audit.py gate0-package/
          printf '%s\n' "$GITHUB_SHA" > gate0-package/WORKFLOW_COMMIT.txt
          cat > gate0-package/README.txt <<EOF
          VitaBrightEX pseudo-v1.4 Gate-0 research observer
          workflow commit: $GITHUB_SHA
          protocol: v5
          target: PCH-2000 retail firmware 3.65 Ensō

          This is a read-only research observer. It does not intentionally write CSC,
          panel commands, brightness state, color-space state, or raw MMIO.

          Verify on macOS after extracting the GitHub artifact:
            cat WORKFLOW_COMMIT.txt
            shasum -a 256 -c SHA256SUMS

          Files intended for the Vita research capture:
            vbe_color_trace.skprx
            vbe_color_trace_drain.vpk
          The SELF is included for provenance/debugging; the VPK packages that SELF.

          Transfer commands once VitaShell FTP is active:
            curl -q --ftp-method nocwd -T vbe_color_trace.skprx ftp://192.168.1.131:1337/ur0:/tai/vbe_color_trace.skprx
            curl -q --ftp-method nocwd -T vbe_color_trace_drain.vpk ftp://192.168.1.131:1337/ux0:/data/vbe_color_trace_drain.vpk

          Do not issue private panel commands, direct CSC calls, or MMIO writes during Gate-0.
          Use the separately supplied Gate-0 phase procedure for config activation/capture.
          EOF
          (cd gate0-package && sha256sum README.txt WORKFLOW_COMMIT.txt vbe_color_trace.skprx vbe_color_trace_drain.self vbe_color_trace_drain.vpk trace_protocol.h layout_365.h gate0_trace_decode.py gate0_decision_audit.py > SHA256SUMS)
          (cd gate0-package && sha256sum -c SHA256SUMS)
          printf '%s\n' 'GATE0_PACKAGE_SHA256SUMS_BEGIN'
          cat gate0-package/SHA256SUMS
          printf '%s\n' 'GATE0_PACKAGE_SHA256SUMS_END'
          printf 'WORKFLOW_COMMIT=%s\n' "$(cat gate0-package/WORKFLOW_COMMIT.txt)"

      - name: Upload exact Gate-0 protocol-v5 package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vbe-gate0-protocol-v5
          path: gate0-package/
          if-no-files-found: error
