name: LCD color trace diagnostic build

on:
  push:
    branches:
      - research-lcd-color-engine
  workflow_dispatch:

permissions:
  contents: read

env:
  VITASDK: /usr/local/vitasdk
  VDPM_NONINTERACTIVE: 1

jobs:
  build-trace-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vitasdk/vdpm
          ref: c83b88a54ec13372515eeb8b3bdca4b10c36d721
          path: vdpm
      - name: Bootstrap pinned VitaSDK
        run: |
          set -euxo pipefail
          test "$(git -C vdpm rev-parse HEAD)" = c83b88a54ec13372515eeb8b3bdca4b10c36d721
          bash vdpm/bootstrap-vitasdk.sh
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          "$VITASDK/bin/vdpm" install taihen
      - name: Assert hardened nonblocking trace contract
        run: |
          set -euxo pipefail
          p=research/diagnostics/iftu_csc_trace/main.c
          h=research/diagnostics/iftu_csc_trace/trace_protocol.h
          l=research/diagnostics/iftu_csc_trace/layout_365.h
          d=research/diagnostics/iftu_csc_trace/drain.c
          grep -F '0x0FCBF457u' "$p"
          grep -F '0xD64F4C6Bu' "$p"
          grep -F 'LOWIO_PLANE_SEGMENT         1' "$p"
          grep -F 'LOWIO_PLANE_SEGMENT_OFFSET  0x37Cu' "$p"
          grep -F 'VBE_LCD_PANEL_WRITER_OFFSET       0xA54u' "$l"
          grep -F 'VBE_LCD_PANEL_READER_OFFSET       0x5B4u' "$l"
          grep -F 'VBE_LCD_STATE_OFFSET              0xA0u' "$l"
          grep -F 'vbe_lcd_panel_writer_signature' "$l"
          grep -F 'vbe_lcd_panel_reader_signature' "$l"
          grep -F 'VBE_TRACE_RECORD_CAPACITY         512u' "$h"
          grep -F 'VBE_TRACE_PAYLOAD_MAX             256u' "$h"
          grep -F 'VBE_TRACE_REQUIRED_AFFINE_HOOKS' "$h"
          grep -F 'VBE_TRACE_REQUIRED_PANEL_HOOKS' "$h"
          grep -F 'VBE_TRACE_PANEL_READ_ENTER' "$h"
          grep -F 'VBE_TRACE_PANEL_READ_EXIT' "$h"
          grep -F 'VBE_TRACE_DISPLAY_ON_ENTER' "$h"
          grep -F 'VBE_TRACE_DISPLAY_ON_EXIT' "$h"
          grep -F 'VBE_TRACE_IFTU_ENABLE_ENTER' "$h"
          grep -F 'VBE_TRACE_IFTU_ENABLE_EXIT' "$h"
          grep -F 'g_enabled = 0;' "$p"
          grep -F 'release_owned_hook' "$p"
          grep -F 'snapshot_data_read(&a,available);' "$p"
          grep -F 'snapshot_data_read(&b,available);' "$p"
          grep -F 'missing_required_mask' "$p"
          grep -F 'validate_records' "$d"
          grep -F 'VBE_TRACE_CAPTURE_PARTIAL' "$d"
          ! grep -E 'ksceIo|sceIo|snprintf|printf|malloc|calloc|realloc|ksceKernelAlloc|CreateThread|CreateTimer|DelayThread|Wait' "$p"
          ! grep -E 'taiInject|SetDisplayColorSpace|SetBrightness' "$p"
          ! grep -E '0x8100B37C|0x81000A54|0x810005B4|0x810020A0' "$p"
      - name: Build hardened ring-buffer diagnostic and user drain with Werror
        run: |
          set -euxo pipefail
          cmake -S research/diagnostics/iftu_csc_trace -B trace-build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"
          cmake --build trace-build --parallel
          test -s trace-build/vbe_color_trace.skprx
          test -s trace-build/vbe_color_trace_drain.self
          test -s trace-build/vbe_color_trace_drain.vpk
          sha256sum trace-build/vbe_color_trace.skprx trace-build/vbe_color_trace_drain.self trace-build/vbe_color_trace_drain.vpk
      - name: Upload hardened Gate-0 trace diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vbe-color-trace-diagnostic
          path: |
            trace-build/vbe_color_trace.skprx
            trace-build/vbe_color_trace_drain.self
            trace-build/vbe_color_trace_drain.vpk
            research/diagnostics/iftu_csc_trace/trace_protocol.h
            research/diagnostics/iftu_csc_trace/layout_365.h
