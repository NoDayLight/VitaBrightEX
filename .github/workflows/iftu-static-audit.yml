name: IFTU static audit

on:
  push:
    branches:
      - research-iftu-static-audit

permissions:
  contents: read

env:
  PUP_URL: https://web.archive.org/web/20180630222648id_/http://dus01.psp2.update.playstation.net/update/psp2/image/2017_0317/rel_0a0f2a9ae58968ac5d1d2127049c3cba/PSP2UPDAT.PUP
  PUP_MD5: 0a0f2a9ae58968ac5d1d2127049c3cba
  PUP_SHA256: 86859b3071681268b6d0beb5ef691da874b6726e85b6f06a1cdf6a0e183e77c6
  SCEUTILS_SHA: 0466d003246ec986ab6189e6719dcb196a40fb02
  VITALOADER_REDUX_SHA: 07922130ce6952c68b6e4b08beb01c137203f1bf
  VITA_HEADERS_SHA: 5e1e7d38d766e4c1634a77f6e5249caab8c8f9cb
  VDPM_SHA: c83b88a54ec13372515eeb8b3bdca4b10c36d721
  VITA_TOOLCHAIN_SHA: eacff34d18e9872a78c0e520e1997ef71900ebb4
  LEGACY_V13_SHA: f1e8cba5087c08114890fc1cd0c7a1a462e893ac
  PY2_IMAGE: python@sha256:d8fac68ebdc45b8d66d53f1ed6c1532da81109a8f5532a6ca0c951ed31107d70

jobs:
  audit-365:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Record pinned research inputs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "sceutils=$SCEUTILS_SHA" \
            "VitaLoaderRedux=$VITALOADER_REDUX_SHA" \
            "vita-headers=$VITA_HEADERS_SHA" \
            "vdpm=$VDPM_SHA" \
            "vita-toolchain=$VITA_TOOLCHAIN_SHA" \
            "legacy-v1.3=$LEGACY_V13_SHA" \
            "python2-image=$PY2_IMAGE" \
            "pycryptodome=3.9.9" \
            "enum34=1.1.10" \
            "capstone=5.0.3"

      - name: Download and verify retail 3.65 PUP
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 "$PUP_URL" -o PSP2UPDAT-365.PUP
          echo "$PUP_MD5  PSP2UPDAT-365.PUP" | md5sum -c -
          echo "$PUP_SHA256  PSP2UPDAT-365.PUP" | sha256sum -c -

      - name: Install FAT and analysis prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y mtools file
          mdir -V || true
          python3 -m pip install --disable-pip-version-check --user capstone==5.0.3

      - name: Fetch pinned references
        shell: bash
        run: |
          set -euxo pipefail
          fetch_exact() {
            repo="$1"; sha="$2"; dir="$3"
            git init -q "$dir"
            git -C "$dir" remote add origin "$repo"
            git -C "$dir" fetch -q --depth 1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }
          fetch_exact https://github.com/RealYoti/sceutils.git "$SCEUTILS_SHA" sceutils-audit
          fetch_exact https://github.com/CreepNT/VitaLoaderRedux.git "$VITALOADER_REDUX_SHA" vlr-reference
          fetch_exact https://github.com/vitasdk/vita-headers.git "$VITA_HEADERS_SHA" vita-headers-reference
          fetch_exact https://github.com/vitasdk/vdpm.git "$VDPM_SHA" vdpm-reference
          fetch_exact https://github.com/vitasdk/vita-toolchain.git "$VITA_TOOLCHAIN_SHA" vita-toolchain-reference
          fetch_exact https://github.com/Zushikina-kun/VitaBrightEX.git "$LEGACY_V13_SHA" legacy-v13
          cp sceutils-audit/keys_external.py sceutils-audit/keys.py
          mkdir -p sceutils-audit/unarzl
          : > sceutils-audit/unarzl/unarzl

      - name: Decrypt the os0 package
        shell: bash
        run: |
          set -euxo pipefail
          cat > extract_os0.py <<'PY'
          import os
          import sys
          sys.path.insert(0, 'sceutils-audit')
          import pup_fiction
          os.makedirs('fw/PUP')
          os.makedirs('fw/PUP_dec')
          pup_fiction.pup_extract_files('PSP2UPDAT-365.PUP', 'fw/PUP')
          pup_fiction.pup_decrypt_packages('fw/PUP', 'fw/PUP_dec')
          if not os.path.isfile('fw/PUP_dec/os0.bin'):
              raise SystemExit('os0.bin was not produced')
          PY
          docker run --rm -v "$PWD:/work" -w /work "$PY2_IMAGE" bash -lc "pip install --disable-pip-version-check pycryptodome==3.9.9 enum34==1.1.10 && python extract_os0.py"
          sudo chown -R "$(id -u):$(id -g)" fw
          echo '35480a01ea783df859326d8698831afd3e850717f5b7785ab9964eab23712856  fw/PUP_dec/os0.bin' | sha256sum -c -
          file fw/PUP_dec/os0.bin

      - name: Extract only target kernel modules from FAT16 os0
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p fw/raw
          for module in lowio display lcd oled; do
            echo "extracting os0:/kd/${module}.skprx"
            mcopy -n -i fw/PUP_dec/os0.bin "::/kd/${module}.skprx" "fw/raw/${module}.skprx"
            test -s "fw/raw/${module}.skprx"
          done
          sha256sum fw/raw/*.skprx

      - name: Decrypt target SELF modules to ELF
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p fw/elf
          for module in lowio display lcd oled; do
            docker run --rm -v "$PWD:/work" -w /work "$PY2_IMAGE" bash -lc "pip install --disable-pip-version-check pycryptodome==3.9.9 enum34==1.1.10 >/dev/null && python sceutils-audit/self2elf.py -i fw/raw/${module}.skprx -o fw/elf/${module}.elf >/dev/null"
          done
          sudo chown -R "$(id -u):$(id -g)" fw/elf
          file fw/elf/*.elf
          sha256sum fw/elf/*.elf

      - name: Emit proof-grade target CFG and call-site evidence
        shell: bash
        run: |
          set -euxo pipefail
          python3 research/vita_elf_audit.py fw/elf/lowio.elf fw/elf/display.elf fw/elf/lcd.elf fw/elf/oled.elf --json audit-365.json | tee audit-365.txt
          python3 - <<'PY'
          import json
          records=json.load(open('audit-365.json'))
          display=next(x for x in records if x['module']=='SceDisplay')
          bynid={x['nid']:x for x in display['target_imports']}
          for nid in (0x0FCBF457,0x357EAE24,0xD64F4C6B):
              if nid not in bynid or not bynid[nid]['proven_callsites']:
                  raise SystemExit('no PROVEN_CALLSITE for IFTU import 0x%08X' % nid)
              print('0x%08X proven_calls=%d candidate_xrefs=%d' % (nid,len(bynid[nid]['proven_callsites']),len(bynid[nid]['candidate_xrefs'])))
          PY

      - name: Prove legacy v1.3 IFTU ABI mismatch
        shell: bash
        run: |
          set -euxo pipefail
          sha256sum legacy-v13/screen_filter.c
          python3 research/prove_legacy_iftu_abi.py --lowio fw/elf/lowio.elf --legacy-screen-filter legacy-v13/screen_filter.c

      - name: Verify known static layout evidence
        shell: bash
        run: |
          set -euxo pipefail
          python3 research/verify_static_layouts.py --lcd fw/elf/lcd.elf --oled fw/elf/oled.elf

      - name: Remove proprietary firmware bytes before job completion
        if: always()
        shell: bash
        run: |
          sudo rm -rf PSP2UPDAT-365.PUP fw sceutils-audit extract_os0.py vlr-reference vita-headers-reference vdpm-reference vita-toolchain-reference legacy-v13 audit-365.json audit-365.txt
