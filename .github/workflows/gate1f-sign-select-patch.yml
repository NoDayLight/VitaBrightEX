name: Gate-1F one-shot sign selector patch
on:
  push:
    branches: [research-gate1f-ctm-semantics]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/gate1f_ctm_semantics/gate1f.c')
          s=p.read_text()
          old='''static int is_unambiguous_rgb(const Observation *o) {\n    return o->patch>=OBS_R && o->patch<=OBS_B && o->component>=OBS_R && o->component<=OBS_B && o->isolated==ISO_YES;\n}\n'''
          new='''static int is_unambiguous_rgb(const Observation *o) {\n    return o->patch>=OBS_R && o->patch<=OBS_B &&\n           o->component>=OBS_R && o->component<=OBS_B &&\n           o->direction==DIR_INCREASE && o->isolated==ISO_YES;\n}\n'''
          if old not in s: raise SystemExit('selector block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'gate1f-ci'
          git config user.email 'gate1f-ci@users.noreply.github.com'
          git add tools/gate1f_ctm_semantics/gate1f.c
          git commit -m 'gate1f: require positive direction for signed reference'
          git push origin HEAD:research-gate1f-ctm-semantics
